<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background with rounded corner mask safe area -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#312e81" stroke-width="6" stroke-opacity="0.4" />

  <!-- Ambient Glow Center -->
  <circle cx="256" cy="240" r="140" fill="url(#glowGrad)" />

  <!-- Modern Acoustic Waveform Bars (Voice Capture Representation) -->
  <g fill="url(#primaryGrad)" filter="url(#dropGlow)">
    <rect x="130" y="210" width="18" height="60" rx="9" opacity="0.65" />
    <rect x="165" y="180" width="18" height="120" rx="9" opacity="0.8" />
    <rect x="200" y="140" width="18" height="200" rx="9" opacity="0.95" />
    
    <!-- Central Microphone & Architecture Pillar -->
    <rect x="238" y="110" width="36" height="230" rx="18" fill="url(#primaryGrad)" />
    
    <rect x="294" y="140" width="18" height="200" rx="9" opacity="0.95" />
    <rect x="329" y="180" width="18" height="120" rx="9" opacity="0.8" />
    <rect x="364" y="210" width="18" height="60" rx="9" opacity="0.65" />
  </g>


  <!-- Enterprise V2 Badge Ribbon -->
  <g transform="translate(196, 380)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <text x="60" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">
      REQ-V2
    </text>
  </g>
</svg>
